"settings.read_only_files" = "以只读方式打开匹配这些 Glob 模式的文件。可以查看但不能编辑，适用于构建输出、外部依赖或生成的文件。\n\n默认值：\n\n```json\n{\n  \"read_only_files\": []\n}\n```\n\n使用 `\"...\"` 添加模式，无需重复 Zed Lite 的默认值。在项目设置中，这会扩展用户或父级配置的值；省略 `\"...\"` 则替换继承的列表。\n\n```json\n{\n  \"read_only_files\": [\"**/build/**\", \"...\"]\n}\n```\n\n继承的模式插入到 `\"...\"` 所在的位置；重复项仅保留第一次出现的位置。"
