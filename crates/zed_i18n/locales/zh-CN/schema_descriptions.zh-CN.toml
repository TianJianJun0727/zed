"settings.ProjectTerminalSettingsContent.path_hyperlink_regexes" = "用于识别路径并提供超链接跳转的正则表达式。\n\n默认值：\n\n```json\n{\n  \"terminal\": {\n    \"path_hyperlink_regexes\": [\n      // Python-style diagnostics\n      \"File \\\"(?<path>[^\\\"]+)\\\", line (?<line>[0-9]+)\",\n      // Common path syntax with optional line, column, description, trailing punctuation, or\n      // surrounding symbols or quotes\n      [\n        \"(?x)\",\n        \"(?<path>\",\n        \"    (\",\n        \"        # multi-char path: first char (not opening delimiter, space, or box drawing char)\",\n        \"        [^({\\\\[<\\\"'`\\\\ \\\\u2500-\\\\u257F]\",\n        \"        # middle chars: non-space, and colon/paren only if not followed by digit/paren/space\",\n        \"        ([^\\\\ :(]|[:(][^0-9()\\\\ ])*\",\n        \"        # last char: not closing delimiter or colon\",\n        \"        [^()}\\\\]>\\\"'`.,;:\\\\ ]\",\n        \"    |\",\n        \"        # single-char path: not delimiter, punctuation, space, or box drawing char\",\n        \"        [^(){}\\\\[\\\\]<>\\\"'`.,;:\\\\ \\\\u2500-\\\\u257F]\",\n        \"    )\",\n        \"    # optional line/column suffix (included in path for PathWithPosition::parse_str)\",\n        \"    (:+[0-9]+(:[0-9]+)?|:?\\\\([0-9]+([,:]?[0-9]+)?\\\\))?\",\n        \")\"\n      ]\n    ]\n  }\n}\n```\n\n使用 `\"...\"` 添加正则表达式，无需重复 Zed Lite 的默认值。在项目设置中，这会扩展用户或父级配置的值；省略 `\"...\"` 则替换继承的列表。设为 `[]` 可清空列表；省略此设置则保留继承的列表。\n\n```json\n{\n  \"terminal\": {\n    \"path_hyperlink_regexes\": [\n      \"\\\\s+(-->|:::|at) (?<link>(?<path>.+?))(:$|$)\",\n      \"\\\\s+(Compiling|Checking|Documenting) [^(]+\\\\((?<link>(?<path>.+))\\\\)\",\n      \"...\"\n    ]\n  }\n}\n```\n\n继承的正则表达式插入到 `\"...\"` 所在的位置；重复项仅保留第一次出现的位置。多行条目用换行符连接后，文本相同的正则表达式视为重复项。\n\n每个正则表达式可以是单个字符串，也可以是用换行符连接的字符串数组。只有顶层字符串中的 `\"...\"` 会被视为继承标记。要用 `...` 匹配三个任意字符，请使用 `[\"...\"]` 作为条目。多行条目中的 `\"...\"` 行始终按正则表达式文本处理。\n\n可选的命名捕获组 `path` 指定超链接目标；省略时使用整个匹配项。提供 `path` 时，`line` 和 `column` 指定位置。没有捕获 `line` 时，内置的后缀处理会解析 `line:column` 和 `(line,column)` 形式。可选的 `link` 捕获组指定可点击文本；省略时整个匹配项均可点击。\n\n找到第一个匹配终端行的正则表达式后就停止处理，即使光标不在其可点击文本范围内。因此，应将更具体的正则表达式放在较宽泛的表达式之前。使用 Rust 的 `regex` 语法；无效表达式会被记录并忽略。`path_hyperlink_timeout_ms` 控制识别超时，设为 `0` 可停用路径超链接。"
