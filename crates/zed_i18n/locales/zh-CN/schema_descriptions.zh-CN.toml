"settings.file_scan_exclusions" = "从文件扫描、文件搜索和项目文件树中排除匹配这些 Glob 模式的文件。优先级高于 `file_scan_inclusions`。\n\n默认值：\n\n```json\n{\n  \"file_scan_exclusions\": [\n    \"**/.git\",\n    \"**/.svn\",\n    \"**/.hg\",\n    \"**/.jj\",\n    \"**/.sl\",\n    \"**/.repo\",\n    \"**/CVS\",\n    \"**/.DS_Store\",\n    \"**/Thumbs.db\",\n    \"**/.classpath\",\n    \"**/.settings\"\n  ]\n}\n```\n\n使用 `\"...\"` 添加模式，无需重复 Zed Lite 的默认值。在项目设置中，这会扩展用户或父级配置的值；省略 `\"...\"` 则替换继承的列表。\n\n```json\n{\n  \"file_scan_exclusions\": [\"**/node_modules\", \"...\"]\n}\n```\n\n继承的模式插入到 `\"...\"` 所在的位置；重复项仅保留第一次出现的位置。"
"settings.file_scan_inclusions" = "扫描时包含匹配这些 Glob 模式的文件，即使它们被 Git 忽略。过于宽泛的模式可能降低扫描速度。`file_scan_exclusions` 的优先级更高。\n\n默认值：\n\n```json\n{\n  \"file_scan_inclusions\": [\".env*\"]\n}\n```\n\n使用 `\"...\"` 添加模式，无需重复 Zed Lite 的默认值。在项目设置中，这会扩展用户或父级配置的值；省略 `\"...\"` 则替换继承的列表。\n\n```json\n{\n  \"file_scan_inclusions\": [\"**/build/**\", \"...\"]\n}\n```\n\n继承的模式插入到 `\"...\"` 所在的位置；重复项仅保留第一次出现的位置。"
"settings.format_on_save" = "保存前是否格式化缓冲区。\n\n默认值：off"
"settings.fullscreen_mode" = "`zed::ToggleFullScreen` 操作进入哪种全屏模式（仅限 macOS）。\n\n默认值：native"
"settings.helix_mode" = "是否启用 Helix 模式。\n\n默认值：false"
"settings.hidden_files" = "将匹配这些 Glob 模式的文件与文件夹视为隐藏项，包括匹配文件夹中的文件。要隐藏这些条目，可从命令面板执行 `project panel: toggle hide hidden`，或将 `project_panel.hide_hidden` 设为 `true`。\n\n默认值：\n\n```json\n{\n  \"hidden_files\": [\"**/.*\"]\n}\n```\n\n使用 `\"...\"` 添加模式，无需重复 Zed Lite 的默认值。在项目设置中，这会扩展用户或父级配置的值；省略 `\"...\"` 则替换继承的列表。\n\n```json\n{\n  \"hidden_files\": [\"**/*.log\", \"...\"],\n  \"project_panel\": {\n    \"hide_hidden\": true\n  }\n}\n```\n\n继承的模式插入到 `\"...\"` 所在的位置；重复项仅保留第一次出现的位置。"
"settings.jupyter" = "Jupyter REPL 设置。"
