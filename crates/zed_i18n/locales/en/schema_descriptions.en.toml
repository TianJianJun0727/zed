"settings.file_scan_exclusions" = "Exclude files matching these glob patterns from file scans, file searches,\nand the project file tree. Takes precedence over `file_scan_inclusions`.\n\nDefault:\n\n```json\n{\n  \"file_scan_exclusions\": [\n    \"**/.git\",\n    \"**/.svn\",\n    \"**/.hg\",\n    \"**/.jj\",\n    \"**/.sl\",\n    \"**/.repo\",\n    \"**/CVS\",\n    \"**/.DS_Store\",\n    \"**/Thumbs.db\",\n    \"**/.classpath\",\n    \"**/.settings\"\n  ]\n}\n```\n\nUse `\"...\"` to add patterns without repeating Zed's defaults. In project\nsettings, it extends the user or parent configuration value. Omit\n`\"...\"` to replace the inherited list.\n\n```json\n{\n  \"file_scan_exclusions\": [\"**/node_modules\", \"...\"]\n}\n```\n\nInherited patterns are inserted at `\"...\"`, and duplicates keep their first\noccurrence."
"settings.file_scan_inclusions" = "Include files matching these glob patterns when scanning, even if ignored\nby Git. Note that broad patterns can slow file scanning.\n`file_scan_exclusions` takes precedence.\n\nDefault:\n\n```json\n{\n  \"file_scan_inclusions\": [\".env*\"]\n}\n```\n\nUse `\"...\"` to add patterns without repeating Zed's defaults. In project\nsettings, it extends the user or parent configuration value. Omit\n`\"...\"` to replace the inherited list.\n\n```json\n{\n  \"file_scan_inclusions\": [\"**/build/**\", \"...\"]\n}\n```\n\nInherited patterns are inserted at `\"...\"`, and duplicates keep their first\noccurrence."
"settings.format_on_save" = "Whether or not to perform a buffer format before saving.\n\nDefault: off"
"settings.fullscreen_mode" = "Which fullscreen mode the `zed::ToggleFullScreen` action enters (macOS only).\n\nDefault: native"
"settings.helix_mode" = "Whether or not to enable Helix mode.\n\nDefault: false"
"settings.hidden_files" = "Treat files and folders matching these glob patterns as hidden, including\nfiles inside matching folders. To hide these entries, run\n`project panel: toggle hide hidden` from the command palette or set\n`project_panel.hide_hidden` to `true`.\n\nDefault:\n\n```json\n{\n  \"hidden_files\": [\"**/.*\"]\n}\n```\n\nUse `\"...\"` to add patterns without repeating Zed's defaults. In project\nsettings, it extends the user or parent configuration value. Omit\n`\"...\"` to replace the inherited list.\n\n```json\n{\n  \"hidden_files\": [\"**/*.log\", \"...\"],\n  \"project_panel\": {\n    \"hide_hidden\": true\n  }\n}\n```\n\nInherited patterns are inserted at `\"...\"`, and duplicates keep their first\noccurrence."
"settings.jupyter" = "Jupyter REPL settings."
"settings.mermaid_font_family" = "The name of a font to use for rendering Mermaid diagrams in the\nmarkdown preview. Falls back to the UI font if unset."
"settings.on_new_window" = "What to show when opening a new window.\nValues: empty_tab, launchpad\nDefault: launchpad"
"settings.prettier" = "Zed's Prettier integration settings.\nAllows to enable/disable formatting with Prettier\nand configure default Prettier, used when no project-level Prettier installation is found.\n\nDefault: off"
"settings.read_only_files" = "Treat files matching these glob patterns as read-only when opened. You can\nview but not edit them, which is useful for build outputs, external\ndependencies, or generated files.\n\nDefault:\n\n```json\n{\n  \"read_only_files\": []\n}\n```\n\nUse `\"...\"` to add patterns without repeating Zed's defaults. In project\nsettings, it extends the user or parent configuration value. Omit\n`\"...\"` to replace the inherited list.\n\n```json\n{\n  \"read_only_files\": [\"**/build/**\", \"...\"]\n}\n```\n\nInherited patterns are inserted at `\"...\"`, and duplicates keep their first\noccurrence."
"settings.restore_on_startup" = "Controls previous session restoration in freshly launched Zed instance.\nValues: empty_tab, last_workspace, last_session, launchpad\nDefault: last_session"
