"the_maximum_number_of_lines_to_keep_in_the_scrollback" = "The maximum number of lines to keep in the scrollback history.\nMaximum allowed value is 100_000, all values above that will be treated as 100_000.\n0 disables the scrolling.\nExisting terminals will not pick up this change until they are recreated.\nSee <a href=\"https://github.com/alacritty/alacritty/blob/cb3a79dbf6472740daca8440d5166c1d4af5029e/extra/man/alacritty.5.scd?plain=1#L207-L213\">Alacritty documentation</a> for more information.\n\nDefault: 10_000"
"the_maximum_width_in_pixels_of_the_rendered_markdown_content" = "The maximum width, in pixels, of the rendered markdown content when\n`limit_content_width` is enabled.\n\nDefault: 800"
"the_minimum_apca_perceptual_contrast_between_foreground_and_background_colors" = "The minimum APCA perceptual contrast between foreground and background colors.\n\nAPCA (Accessible Perceptual Contrast Algorithm) is more accurate than WCAG 2.x,\nespecially for dark mode. Values range from 0 to 106.\n\nBased on APCA Readability Criterion (ARC) Bronze Simple Mode:\nhttps://readtech.org/ARC/tests/bronze-simple-mode/\n- 0: No contrast adjustment\n- 45: Minimum for large fluent text (36px+)\n- 60: Minimum for other content text\n- 75: Minimum for body text\n- 90: Preferred for body text\n\nDefault: 45"
"the_minimum_apca_perceptual_contrast_to_maintain_when_rendering_text" = "The minimum APCA perceptual contrast to maintain when\nrendering text over highlight backgrounds in the editor.\n\nValues range from 0 to 106. Set to 0 to disable adjustments.\nDefault: 45"
"the_minimum_column_number_to_show_the_inline_blame_information" = "The minimum column number to show the inline blame information at\n\nDefault: 0"
"the_minimum_column_to_display_inline_diagnostics_this_setting_can" = "The minimum column to display inline diagnostics. This setting can be\nused to horizontally align inline diagnostics at some position. Lines\nlonger than this value will still push diagnostics further to the right.\n\nDefault: 0"
"the_minimum_width_in_em_widths_at_which_the_split" = "The minimum width (in em-widths) at which the split diff view is used.\nWhen the editor is narrower than this, the diff view automatically\nswitches to unified mode and switches back when the editor is wide\nenough. Set to 0 to disable automatic switching.\n\nDefault: 100"
