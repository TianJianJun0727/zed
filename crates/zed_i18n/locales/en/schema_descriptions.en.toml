"the_list_of_language_servers_to_use_or_disable_for" = "The list of language servers to use (or disable) for this language.\n\nThis array should consist of language server IDs, as well as the following\nspecial tokens:\n- `\"!<language_server_id>\"` - A language server ID prefixed with a `!` will be disabled.\n- `\"...\"` - A placeholder to refer to the **rest** of the registered language servers for this language.\n\nDefault: [\"...\"]"
"the_maximum_amount_of_time_to_wait_for_responses_from" = "The maximum amount of time to wait for responses from language servers, in seconds.\nA value of `0` will result in no timeout being applied (causing all LSP responses to wait indefinitely until completed).\n\nDefault: `120`"
