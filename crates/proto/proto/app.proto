syntax = "proto3";
package zed.messages;



message Toast {
  uint64 project_id = 1;
  string notification_id = 2;
  string message = 3;
}

message HideToast {
  uint64 project_id = 1;
  string notification_id = 2;
}

// A telemetry event generated on the remote server, forwarded to the client for
// reporting. The OS metadata is not included: the client already knows the
// remote platform from connection setup and attaches it when reporting.










message Extension {
  string id = 1;
  string version = 2;
  bool dev = 3;
  optional uint64 content_fingerprint = 4;
}







message AskPassRequest {
  uint64 project_id = 1;
  reserved 2;
  uint64 repository_id = 3;
  uint64 askpass_id = 4;
  string prompt = 5;
}

message AskPassResponse {
  string response = 1;
}
